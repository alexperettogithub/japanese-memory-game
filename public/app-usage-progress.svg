<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
  <title id="title">Progress preview</title>
  <desc id="desc">A stylized Japanese Memory Game progress view with search, grade buttons, and leaderboard publishing.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff7df"/>
      <stop offset="0.45" stop-color="#eaf9ff"/>
      <stop offset="1" stop-color="#ffeaf6"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ff4fa3"/>
      <stop offset="1" stop-color="#7c3cff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#34185e" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="960" height="620" rx="46" fill="url(#bg)"/>
  <rect x="52" y="54" width="856" height="512" rx="38" fill="#fff" fill-opacity="0.78" stroke="#fff" stroke-width="6" filter="url(#shadow)"/>
  <text x="92" y="112" fill="#6b5f7d" font-family="Arial, sans-serif" font-size="28" font-weight="800">Focused practice</text>
  <rect x="92" y="146" width="528" height="64" rx="22" fill="#fff" stroke="#201335" stroke-opacity="0.12" stroke-width="3"/>
  <text x="126" y="187" fill="#6b5f7d" font-family="Arial, sans-serif" font-size="24" font-weight="800">Search: 水 / mizu / water</text>
  <g font-family="Arial, sans-serif" font-weight="900" text-anchor="middle">
    <rect x="652" y="146" width="84" height="64" rx="22" fill="url(#accent)"/>
    <text x="694" y="187" fill="#fff" font-size="22">G1</text>
    <rect x="752" y="146" width="84" height="64" rx="22" fill="#fffaf2" stroke="#fff" stroke-width="5"/>
    <text x="794" y="187" fill="#201335" font-size="22">G2</text>
  </g>
  <rect x="92" y="254" width="230" height="206" rx="30" fill="#fffaf2" stroke="#fff" stroke-width="7"/>
  <text x="207" y="370" fill="#201335" font-family="Arial, sans-serif" font-size="98" font-weight="900" text-anchor="middle">山</text>
  <rect x="365" y="254" width="230" height="206" rx="30" fill="#eaf9ff" stroke="#fff" stroke-width="7"/>
  <text x="480" y="370" fill="#201335" font-family="Arial, sans-serif" font-size="98" font-weight="900" text-anchor="middle">川</text>
  <rect x="638" y="254" width="230" height="206" rx="30" fill="#ffeaf6" stroke="#fff" stroke-width="7"/>
  <text x="753" y="370" fill="#201335" font-family="Arial, sans-serif" font-size="98" font-weight="900" text-anchor="middle">水</text>
  <rect x="230" y="496" width="500" height="54" rx="27" fill="#201335"/>
  <text x="480" y="531" fill="#fff" font-family="Arial, sans-serif" font-size="23" font-weight="900" text-anchor="middle">Best 160 · Last run 03:08 · Optional leaderboard</text>
</svg>
