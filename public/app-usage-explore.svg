<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
  <title id="title">Explore mode preview</title>
  <desc id="desc">A stylized Japanese Memory Game Explore mode screen with cards for hiragana, katakana, and kanji.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff7df"/>
      <stop offset="0.5" stop-color="#ffeaf6"/>
      <stop offset="1" stop-color="#eaf9ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#7c3cff"/>
      <stop offset="1" stop-color="#ff4fa3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#34185e" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="960" height="620" rx="46" fill="url(#bg)"/>
  <rect x="52" y="54" width="856" height="512" rx="38" fill="#fff" fill-opacity="0.74" stroke="#fff" stroke-width="6" filter="url(#shadow)"/>
  <text x="92" y="112" fill="#6b5f7d" font-family="Arial, sans-serif" font-size="28" font-weight="800">Explore mode</text>
  <rect x="650" y="78" width="198" height="54" rx="27" fill="url(#accent)"/>
  <text x="692" y="114" fill="#fff" font-family="Arial, sans-serif" font-size="24" font-weight="900">Shuffle</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="92" y="174" width="232" height="284" rx="34" fill="#fffaf2" stroke="#fff" stroke-width="8" filter="url(#shadow)"/>
    <text x="208" y="245" fill="#6b5f7d" font-size="22" font-weight="800">Hiragana</text>
    <text x="208" y="355" fill="#201335" font-size="128" font-weight="900">あ</text>
    <text x="208" y="414" fill="#201335" font-size="32" font-weight="900">a</text>
    <rect x="364" y="174" width="232" height="284" rx="34" fill="#fff0f8" stroke="#fff" stroke-width="8" filter="url(#shadow)"/>
    <text x="480" y="245" fill="#6b5f7d" font-size="22" font-weight="800">Katakana</text>
    <text x="480" y="355" fill="#201335" font-size="128" font-weight="900">ア</text>
    <text x="480" y="414" fill="#201335" font-size="32" font-weight="900">a</text>
    <rect x="636" y="174" width="232" height="284" rx="34" fill="#eaf9ff" stroke="#fff" stroke-width="8" filter="url(#shadow)"/>
    <text x="752" y="245" fill="#6b5f7d" font-size="22" font-weight="800">Kanji</text>
    <text x="752" y="355" fill="#201335" font-size="128" font-weight="900">水</text>
    <text x="752" y="414" fill="#201335" font-size="32" font-weight="900">water</text>
  </g>
  <text x="92" y="516" fill="#6b5f7d" font-family="Arial, sans-serif" font-size="24" font-weight="800">Tap a card to reveal pronunciation and meaning.</text>
</svg>
