<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
  <title id="title">Play mode preview</title>
  <desc id="desc">A stylized Japanese Memory Game Play mode screen with a kanji card, input field, and score panel.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffeaf6"/>
      <stop offset="1" stop-color="#eaf9ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#7c3cff"/>
      <stop offset="1" stop-color="#23d7c7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#34185e" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="960" height="620" rx="46" fill="url(#bg)"/>
  <rect x="52" y="54" width="856" height="512" rx="38" fill="#fff" fill-opacity="0.78" stroke="#fff" stroke-width="6" filter="url(#shadow)"/>
  <text x="92" y="112" fill="#6b5f7d" font-family="Arial, sans-serif" font-size="28" font-weight="800">Play mode</text>
  <g font-family="Arial, sans-serif">
    <rect x="92" y="154" width="204" height="86" rx="24" fill="#201335"/>
    <text x="122" y="190" fill="#fff" font-size="20" font-weight="800">Score</text>
    <text x="122" y="224" fill="#fff" font-size="32" font-weight="900">120</text>
    <rect x="324" y="154" width="204" height="86" rx="24" fill="#fffaf2" stroke="#fff" stroke-width="5"/>
    <text x="354" y="190" fill="#6b5f7d" font-size="20" font-weight="800">Solved</text>
    <text x="354" y="224" fill="#201335" font-size="32" font-weight="900">12/20</text>
    <rect x="556" y="154" width="204" height="86" rx="24" fill="#fffaf2" stroke="#fff" stroke-width="5"/>
    <text x="586" y="190" fill="#6b5f7d" font-size="20" font-weight="800">Best time</text>
    <text x="586" y="224" fill="#201335" font-size="32" font-weight="900">02:41</text>
  </g>
  <rect x="270" y="288" width="420" height="180" rx="34" fill="#fffaf2" stroke="#fff" stroke-width="8" filter="url(#shadow)"/>
  <text x="480" y="406" fill="#201335" font-family="Arial, sans-serif" font-size="112" font-weight="900" text-anchor="middle">火</text>
  <rect x="220" y="492" width="360" height="58" rx="18" fill="#fff" stroke="#201335" stroke-opacity="0.14" stroke-width="3"/>
  <text x="246" y="530" fill="#6b5f7d" font-family="Arial, sans-serif" font-size="24" font-weight="800">type reading...</text>
  <rect x="600" y="492" width="140" height="58" rx="18" fill="url(#accent)"/>
  <text x="670" y="530" fill="#fff" font-family="Arial, sans-serif" font-size="24" font-weight="900" text-anchor="middle">Check</text>
</svg>
