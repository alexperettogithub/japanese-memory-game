<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A lightweight, free software game for studying Japanese hiragana, katakana, and kanji through simple memory cards.">
    <meta name="author" content="Zero Softworks">
    <meta name="license" content="GPL-3.0-or-later">
    <link rel="canonical" href="https://japanesememorygame.com/">
    <meta property="og:title" content="Japanese Memory Game">
    <meta property="og:description" content="Study Japanese in a fun, effective, and lightweight way.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://japanesememorygame.com/">
    <title>Japanese Memory Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page-container">
        <div class="container">
            <h1>Japanese Memory Game</h1>
            <div class="navigation">
                <button class="nav-btn active" data-mode="hiragana">Hiragana</button>
                <button class="nav-btn" data-mode="katakana">Katakana</button>
                <button class="nav-btn" data-mode="kanji">Kanji</button>
                <button class="nav-btn" id="shuffle-btn">Shuffle</button>
            </div>
            <div class="grade-selection" style="display: none;">
                <button class="grade-btn active" data-grade="1">Grade 1 (80)</button>
                <button class="grade-btn" data-grade="2">Grade 2 (160)</button>
                <button class="grade-btn" data-grade="3">Grade 3 (200)</button>
                <button class="grade-btn" data-grade="4">Grade 4 (202)</button>
                <button class="grade-btn" data-grade="5">Grade 5 (193)</button>
                <button class="grade-btn" data-grade="6">Grade 6 (191)</button>
            </div>
            <div class="game-container">
                <div class="cards-grid" id="cardsGrid">
                    <!-- Cards will be generated by JavaScript -->
                </div>
            </div>
        </div>
        <footer>
            <p>Copyleft <span class="rotated">©</span> <span id="current-year">2026</span> <a href="https://www.zerosoftworks.it" target="_blank" rel="noopener noreferrer">Zero Softworks</a></p>
        </footer>
    </div>
    <script src="kanji-data.js"></script>
    <script src="script.js"></script>
</body>
</html>
